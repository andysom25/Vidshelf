name: vidshelf

services:
  vidshelf:
    build: .
    container_name: vidshelf
    restart: unless-stopped
    ports:
      - "5000:5000"
      # If the page hangs for ~30s on Windows and assets show as "(failed)" in
      # DevTools while the container itself is healthy, it is almost certainly
      # NOT this app — it is WSL's wslrelay.exe holding IPv6 loopback for the
      # published port. `localhost` resolves to ::1 before 127.0.0.1, so the
      # browser reaches wslrelay, which accepts the connection and never
      # answers. Hence a hang rather than a connection refused, which reads
      # exactly like an application bug.
      #
      # Changing the host port does NOT help — verified: wslrelay rebinds
      # whatever port Docker publishes, and followed a move from 5000 to 5001
      # immediately. The fix is on the host, in %UserProfile%\.wslconfig:
      #
      #     [wsl2]
      #     localhostForwarding=false
      #
      # followed by `wsl --shutdown`. See README "Troubleshooting".
      #
      # To confirm the diagnosis in ten seconds:
      #     netstat -ano | findstr :5000     -> two different PIDs listening
      #     curl http://127.0.0.1:5000/login -> works
      #     curl http://localhost:5000/login -> hangs
      # If IPv4 works and localhost doesn't, it is this.
    volumes:
      # Mount a persistent downloads directory so files survive container rebuilds
      - ./downloads:/app/downloads
      # All persistent state (config.json + the two tracker files) lives in
      # one mounted DIRECTORY. Do NOT go back to mounting the individual JSON
      # files (as this did before v1.1.0) — two separate failures came from
      # that, both explained in state.py:
      #   1. Docker bind-mounts a single file by inode, and an atomic write
      #      (write temp + os.replace) swaps the inode — so writes silently
      #      stop reaching the host and a restart reads stale state.
      #   2. These files are gitignored, so a fresh clone doesn't have them,
      #      and Docker creates a missing bind-mount source as a *directory* —
      #      which made the app crash-loop at import on every new install.
      # A directory is what Docker auto-creates correctly, so both go away.
      - ./data:/app/data
      # Native Linux CIFS mount of the NAS share (see volumes: below). Do NOT
      # bind-mount a Windows drive letter or UNC path here - Docker Desktop
      # silently substitutes a small local decoy volume instead of erroring,
      # which is why this used to fail with "No space left on device".
      - music_videos_final:/app/music_videos_final
    environment:
      - FLASK_ENV=production
      # Optional — see .env.example. If unset: SECRET_KEY is auto-generated
      # and persisted into config.json on first run; ADMIN_USERNAME defaults
      # to "admin" and ADMIN_PASSWORD is auto-generated and printed once to
      # `docker logs` on first run if not set.
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - PLEX_CLIENT_ID=${PLEX_CLIENT_ID:-}
      - PLEX_PRODUCT=${PLEX_PRODUCT:-}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
    # No added capabilities. SYS_ADMIN used to be granted here, left over from
    # an approach where the container mounted the CIFS share itself. It does
    # not: the `cifs` volume driver below performs the mount on the host, and a
    # container with zero added capabilities can both read and write the share
    # (verified). SYS_ADMIN is one of the broadest capabilities available and is
    # close to a container-escape primitive, so granting it for nothing was the
    # worst trade in this file.
    cap_drop:
      - ALL

volumes:
  music_videos_final:
    driver_opts:
      type: cifs
      o: "username=${NAS_SMB_USER},password=${NAS_SMB_PASS},vers=3.0,uid=1000,gid=1000,file_mode=0777,dir_mode=0777"
      device: "${NAS_SMB_DEVICE}"