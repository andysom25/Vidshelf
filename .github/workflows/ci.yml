name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  # NOT ghcr.io/${{ github.repository }}: this repo is "andysom25/Vidshelf"
  # with a capital V, and GHCR only accepts lowercase image names — the push
  # fails with an opaque "invalid reference format" otherwise.
  IMAGE_NAME: ghcr.io/andysom25/vidshelf

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'  # matches the Dockerfile base image

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No pytest dependency on purpose — the suite is plain asserts so it
      # runs identically here and on a developer's machine.
      - name: Run tests
        run: |
          python tests/test_state.py
          python tests/test_updates.py
          python tests/test_routes.py

      # The Artists page's filter/sort logic is client-side, so it's tested by
      # running the real static/js/dashboard.js under node (already present on
      # ubuntu-latest — no setup-node step needed).
      - name: Run front-end tests
        run: |
          node --check static/js/dashboard.js
          node tests/test_artists_filter.js

      - name: Check every module imports
        # Catches the class of breakage that only shows up at import time,
        # which is exactly where the pre-v1.1.0 fresh-install crash lived.
        run: python -c "import state, transcode, downloader, artwork_swap, artwork_sync, updates, app"

  # Decides whether this run should publish, and what version it is publishing.
  #
  # The version always comes from the VERSION file rather than the git ref.
  # docker/metadata-action's type=semver patterns read the *ref*, so they
  # produce nothing on a branch push — and this workflow needs to publish from
  # a main push, not only from a tag.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      major: ${{ steps.resolve.outputs.major }}
      major_minor: ${{ steps.resolve.outputs.major_minor }}
      publish: ${{ steps.resolve.outputs.publish }}
      tag_needed: ${{ steps.resolve.outputs.tag_needed }}
      is_newest: ${{ steps.resolve.outputs.is_newest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # need the full tag list to compare against

      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is not semver: '$version'"; exit 1 ;;
          esac

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"

          publish=false
          tag_needed=false

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # A tag was pushed by hand. Publish it; the tag already exists.
            # Guard against the tag and VERSION disagreeing, which would
            # publish an image whose reported version differs from its tag.
            if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ($version)"
              exit 1
            fi
            publish=true
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # Auto-release: main carries a VERSION that isn't tagged yet.
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already tagged — nothing to release."
            else
              echo "v$version is not tagged yet — will release."
              publish=true
              tag_needed=true
            fi
          fi

          # Only move :latest when this really is the newest release, so
          # re-publishing an older tag can't drag latest backwards.
          newest="$(printf '%s\n' "v$version" $(git tag -l 'v*') | sort -V | tail -1)"
          if [ "$newest" = "v$version" ]; then is_newest=true; else is_newest=false; fi

          {
            echo "version=$version"
            echo "major=$major"
            echo "major_minor=$major.$minor"
            echo "publish=$publish"
            echo "tag_needed=$tag_needed"
            echo "is_newest=$is_newest"
          } >> "$GITHUB_OUTPUT"

          echo "version=$version publish=$publish tag_needed=$tag_needed is_newest=$is_newest"

  publish:
    name: Publish image
    needs: [test, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating the tag and the release needs write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # arm64 matters here: a large share of self-hosted Plex setups are
      # Synology/Raspberry Pi, and an amd64-only image simply won't start.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # type=raw from the VERSION output, not type=semver from the ref —
          # see the version job's comment.
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major_minor }}
            type=raw,value=${{ needs.version.outputs.major }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_newest }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deliberately after the image push: if the build fails there is no tag
      # and no release announcing an artifact that doesn't exist. Re-running
      # after a fix still works, because the version job's check is based on
      # whether the tag exists, not on this run.
      - name: Tag the release
        if: needs.version.outputs.tag_needed == 'true'
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Attributed to the bot on purpose: this tag is created by CI, not by
          # a person. Change these two lines if you'd rather releases carry
          # your own identity.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          # This push uses GITHUB_TOKEN, so it does NOT trigger another CI run.
          # That is load-bearing, not incidental: it's what stops the new tag
          # from starting a second build of the same commit.
          git push origin "refs/tags/v$V"

      - name: Create the GitHub release
        if: needs.version.outputs.tag_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$V" \
            --title "v$V" \
            --generate-notes \
            $([ "${{ needs.version.outputs.is_newest }}" = "true" ] || echo "--latest=false")
